name: Entrega Continua EC2

on:
  workflow_call:

jobs:
  EC2:
    runs-on: ubuntu-latest
    steps:
        - name: Download a Build Artifact
          uses: actions/download-artifact@v4.1.8
          with:
            # Artifact name
            name: programa
            path: ./deploy
        
        - uses: actions/checkout@v3

        - name: Deploy to Staging server
          uses: easingthemes/ssh-deploy@main
          with:
            SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
            REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
            REMOTE_USER: ${{ secrets.REMOTE_USER }}
            TARGET: /home/${{ secrets.REMOTE_USER }}
            SOURCE: ./deploy/main

        - name: executing remote ssh commands using password
          uses: appleboy/ssh-action@v1.2.1
          with:
            host: ${{ secrets.REMOTE_HOST }}
            username: ${{ secrets.REMOTE_USER }}
            key: ${{ secrets.SSH_PRIVATE_KEY }}
            port: 22
            script: |
              cd /home/${{ secrets.REMOTE_USER }}
              if [ ! -f "./main" ]; then
                echo "Erro: Arquivo main não encontrado na máquina remota."
                exit 1
              fi
            
              export HOST=${{ secrets.DBHOST }}
              export USER=${{ secrets.DBUSER }} 
              export PASSWORD=${{ secrets.DBPASSWORD }}
              export DB_NAME=${{ secrets.DBNAME }}
              export DB_PORT=${{ secrets.DBPORT }}
              export PORT=8000
              
              nohup ./main  > nohup.out 2> nohup.err < /dev/null &
