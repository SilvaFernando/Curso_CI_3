name: Entrega Continua EC2

on:
  workflow_call:

jobs:
  EC2:
    runs-on: ubuntu-latest
    steps:
        - name: Download a Build Artifact
          uses: actions/download-artifact@v4.1.8
          with:
            # Artifact name
            name: programa


        - name: Listando arquivos após o download do artefato
          run: ls -lah
          
        - uses: actions/checkout@v3

        - name: Deploy to Staging server
          uses: easingthemes/ssh-deploy@main
          with:
            SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
            REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
            REMOTE_USER: ${{ secrets.REMOTE_USER }}
            TARGET: /home/${{ secrets.REMOTE_USER }}

        #- name: Copiar binário manualmente
        #  run: |
        #    scp -i ~/.ssh/id_rsa ./deploy/main ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}:/home/${{ secrets.REMOTE_USER }}/main


        - name: executing remote ssh commands using password
          uses: appleboy/ssh-action@v1.2.1
          with:
            host: ${{ secrets.REMOTE_HOST }}
            username: ${{ secrets.REMOTE_USER }}
            key: ${{ secrets.SSH_PRIVATE_KEY }}
            port: 22
            script: |
              echo "Listando arquivos no servidor remoto:"
              ls -lah /home/${{ secrets.REMOTE_USER }}
      
              export HOST=${{ secrets.DBHOST }}
              export USER=${{ secrets.DBUSER }} 
              export PASSWORD=${{ secrets.DBPASSWORD }}
              export DB_NAME=${{ secrets.DBNAME }}
              export DB_PORT=${{ secrets.DBPORT }}
              export PORT=8000
              
              nohup ./main  > nohup.out 2> nohup.err < /dev/null &
